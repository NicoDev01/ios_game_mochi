name: iOS TestFlight

# Manuell starten unter: Actions -> iOS TestFlight -> Run workflow
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Buildnummer überschreiben (leer = automatisch höchste TestFlight-Buildnummer + 1)"
        required: false
        default: ""

concurrency: ios-testflight

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (prefer 26.6 if installed)
        run: |
          if [ -d "/Applications/Xcode_26.6.app/Contents/Developer" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:ios

      - name: Decode distribution certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
        run: printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

      - name: Build, sign and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          DIST_CERT_P12_PATH: ${{ runner.temp }}/dist.p12
          BUILD_NUMBER: ${{ inputs.build_number }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
        run: fastlane ios testflight_release

      - name: Remove certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/dist.p12"
